# 푸시할 때마다 검사(lint)와 빌드를 하고,
# main 브랜치이고 Firebase 서비스 계정(Secret)이 등록돼 있으면 Firebase Hosting 에 배포합니다.
#
# 사전 설정
#   1. 저장소에 .env.production (Firebase 웹 설정값) 커밋
#   2. 저장소 Settings → Secrets and variables → Actions → New repository secret
#        FIREBASE_SERVICE_ACCOUNT : 서비스 계정 키 JSON 전체 (README 의 "자동 배포" 참고)
name: Build & Deploy

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install, lint, build
        run: |
          npm ci
          npm run lint
          npm run build

      # .env.production 의 프로젝트 ID 로 배포합니다. 없으면 로컬 모드 사이트가 올라가지 않게 멈춥니다.
      - name: Read Firebase project ID
        id: project
        if: github.ref == 'refs/heads/main' && env.FIREBASE_SERVICE_ACCOUNT != ''
        run: |
          id=$(grep -E '^VITE_FIREBASE_PROJECT_ID=' .env.production 2>/dev/null | cut -d= -f2- | tr -d '[:space:]"')
          if [ -z "$id" ]; then
            echo "::error::.env.production 에 VITE_FIREBASE_PROJECT_ID 가 없습니다."
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Deploy to Firebase Hosting
        if: github.ref == 'refs/heads/main' && env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ steps.project.outputs.id }}
          channelId: live
