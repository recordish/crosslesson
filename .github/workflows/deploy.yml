# 푸시할 때마다 검사(lint)와 빌드를 하고,
# main 브랜치이고 카페24 FTP 정보(Secrets)가 등록돼 있으면 카페24 웹호스팅에 올립니다.
#
# 사전 설정 (저장소 Settings → Secrets and variables → Actions → New repository secret)
#   FTP_SERVER     카페24 FTP 주소 (예: crosslesson.cafe24.com)
#   FTP_USERNAME   FTP 아이디
#   FTP_PASSWORD   FTP 비밀번호
#   FTP_SERVER_DIR 올릴 폴더 (보통 /www/)
# 그리고 저장소에 .env.production (Firebase 웹 설정값)이 있어야 합니다.
name: Build & Deploy

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install, lint, build
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Check Firebase settings before deploy
        if: github.ref == 'refs/heads/main' && env.FTP_SERVER != ''
        run: |
          if ! grep -q '^VITE_FIREBASE_PROJECT_ID=.\+' .env.production 2>/dev/null; then
            echo "::error::.env.production 에 Firebase 설정값이 없습니다. 이대로 올리면 로컬 모드 사이트가 배포됩니다."
            exit 1
          fi

      - name: Upload to Cafe24 (FTP)
        if: github.ref == 'refs/heads/main' && env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./dist/
          # 서버에 있는 예전 PHP 파일은 지우지 않습니다 (직접 백업 후 정리하세요)
          dangerous-clean-slate: false
