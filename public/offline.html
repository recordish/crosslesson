<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Crosslesson</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f7fa; color: #1c2430;
      font-family: system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    @media (prefers-color-scheme: dark) { body { background: #0f1217; color: #e7e9ee; } p { color: #9aa3b2 !important; } }
    .logo { width: 64px; height: 64px; border-radius: 16px; background: #2b9bd8; display: inline-grid; place-items: center; margin-bottom: 16px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { margin: 0 0 24px; color: #6b7585; line-height: 1.6; }
    button { font: inherit; font-size: 16px; font-weight: 700; padding: 12px 28px; border: 0; border-radius: 12px; background: #2b9bd8; color: #fff; }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">
      <svg width="40" height="40" viewBox="0 0 64 64"><path d="M18 26h22l-6-6M46 38H24l6 6" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h1>인터넷에 연결할 수 없어요</h1>
    <p>Wi-Fi나 모바일 데이터가 켜져 있는지 확인한 뒤<br />다시 시도해 주세요.</p>
    <button type="button" onclick="location.href='https://crosslesson.com/'">다시 시도</button>
  </main>
</body>
</html>
